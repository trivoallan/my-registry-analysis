name: Default Security Scorecard
description: Basic security and freshness checks.

levels:
  - name: critical
    color: "#ff0000"
  - name: warning
    color: "#ffa500"
  - name: healthy
    color: "#008000"

sections:
  - name: Security
    levels:
      - name: critical
        color: "#ff0000"
      - name: warning
        color: "#ffa500"
      - name: healthy
        color: "#008000"
    rules:
      - name: no-root
        description: Image should not run as root.
        level: critical
        tags: ["security"]
        condition:
          "!=": [{ var: results.skopeo.platforms.0.user }, root]

      - name: freshness
        description: Image should be less than 30 days old.
        level: warning
        tags: ["security"]
        condition:
          "<": [{ var: results.freshness.age_days }, 30]
      - name: no-critical
        description: No critical vulnerabilities found by Trivy.
        level: critical
        tags: ["security"]
        condition:
          "==": [{ var: results.trivy.critical_count }, 0]
      - name: no-high
        description: No high vulnerabilities found by Trivy.
        level: warning
        tags: ["security"]
        condition:
          "==": [{ var: results.trivy.high_count }, 0]
